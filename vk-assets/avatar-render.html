<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALOS Studio VK Avatar</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 1200px;
        margin: 0;
        overflow: hidden;
        background: #050607;
      }

      .avatar {
        display: grid;
        width: 1200px;
        height: 1200px;
        place-items: center;
        background: #050607;
      }

      svg {
        width: 760px;
        height: 760px;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <main class="avatar" aria-label="ALOS Studio VK avatar">
      <svg viewBox="0 0 1200 1200" role="img" aria-label="Abstract white logo">
        <g transform="translate(600 600) scale(1.08) translate(-600 -600)">
          <path fill="#fff" d="M430 250H872L752 374L544 420Z"/>
          <path fill="#fff" d="M344 392L510 282L632 398L508 556L256 612Z"/>
          <path fill="#fff" d="M756 388L1000 526L854 662L668 520Z"/>
          <path fill="#fff" d="M632 626L830 676L616 936L468 802Z"/>
          <path fill="#fff" d="M248 638L508 580L438 782L292 746Z"/>
          <path fill="#050607" d="M552 486L676 436L766 552L630 666L500 582Z"/>
        </g>
      </svg>
    </main>
  </body>
</html>
